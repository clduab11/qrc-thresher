experiment_name: windowed_w2_phase1
task:
  name: stm
  length: 500
  train_frac: 0.7
  delay_max: 20
  parity_window: 3
reservoir:
  backend: default.qubit
  n_qubits: 4
  depth: 3
  readout: z_only
  window: 2  # input window w of design (a); differs from alpha_lite.yaml only here (D010)
measurement:
  model: exact  # exact expectation values = oracle upper bound (docs/DECISIONS.md D004)
baseline:
  enabled:
    - esn  # random_features returns with its bandwidth fix (D13, CP4)
  esn_grid:
    spectral_radius: [0.8, 0.9, 0.95, 0.99, 1.0]
    input_scaling: [0.1, 0.5, 1.0]
    leak_rate: [0.1, 0.3, 0.5, 1.0]
  esn_washout: 50  # leading rows dropped from ESN selection, training and scoring (D009)
  rks_dim: null
training:
  ridge_alphas: [1.0e-8, 1.0e-6, 1.0e-4, 1.0e-2, 1.0, 100.0]
  cv_folds: 5
proof:
  log_entanglement: true
  log_circuit_hash: true
  log_artifacts: false
seeds:
  task_seed: 42
  reservoir_seed: 137
  n_seeds: 3
gates:
  G1_stm_mc_threshold: 1.0
  G1_margin_pct: 0.20
  G2_accuracy_threshold: 0.70
  G2_random_features_max: 0.60
  G25_effect_se: 1.0
